name: Deploy User Documentation

on:
  push:
    branches: [develop]
    paths:
      - 'docs/user/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: docs/user -> gh-pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Prepare site (docs at root, keep the deployed app)
        run: |
          mkdir -p site
          cp -r docs/user/. site/
          if git fetch --depth=1 origin gh-pages; then
            git archive FETCH_HEAD app | tar -x -C site || true
          fi
          touch site/.nojekyll

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages
          force_orphan: true
          commit_message: "docs: auto-deploy user documentation"
