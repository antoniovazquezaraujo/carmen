name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: tests + build (Node 22)
    runs-on: ubuntu-latest

    env:
      NPM_CONFIG_LOGLEVEL: error

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Node 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Unit tests
        run: npm test

      # `npm test` does not collect coverage; this step enforces the
      # `coverageThreshold` from jest.config.js.
      - name: Coverage (thresholds)
        run: npm run test:cov

      - name: Production build
        run: npm run build
