name: Build and Release

on:
  push:
    tags:
      - 'v*' # v1.0.0, v1.0.0-beta.1, ...
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: build + release web
    runs-on: ubuntu-latest

    env:
      NPM_CONFIG_LOGLEVEL: error

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Node 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Tests
        run: npm test

      # `--base-href ./` makes the app servable from any static folder.
      - name: Production build
        run: npm run build:app -- --base-href ./ && npm run build:cli

      - name: Package web app
        run: |
          cd dist/moderanger/browser
          zip -r ../../moderanger-web.zip .

      - name: Publish release (auto-generated changelog)
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/moderanger-web.zip
          fail_on_unmatched_files: true
          generate_release_notes: true
