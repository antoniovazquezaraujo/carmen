<div class="scale-preview"
  [class.scale-preview--collapse]="collapseMode"
  role="img"
  [attr.aria-label]="ariaLabel">
  <div class="scale-preview-title">{{ previewTitle }}</div>
  <div class="scale-preview-grid">
    @for (row of cells; track $index) {
      @for (cell of row; track $index) {
        <span class="scale-cell"
          [class.scale-cell--empty]="cell === null"
          [class.scale-cell--hidden]="isHidden(cell)"
          [class.scale-cell--visible]="cell !== null && !isHidden(cell)"
          aria-hidden="true">
          {{ cell ?? '' }}
        </span>
      }
    }
  </div>
</div>
